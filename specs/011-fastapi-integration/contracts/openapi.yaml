openapi: 3.1.0
info:
  title: Physical AI RAG Backend API
  description: |
    FastAPI backend for the Physical AI book chatbot. Provides query endpoint
    that integrates with the OpenAI Assistants-based RAG agent (Feature 010).

    ## Features
    - Semantic search over Physical AI book content
    - Conversation history via OpenAI thread IDs
    - Source citations with relevance scores
    - Structured error responses
    - Health check endpoint for monitoring

    ## Authentication
    No authentication required for MVP (local development)

    ## Rate Limiting
    No rate limiting in MVP (future enhancement)
  version: 1.0.0
  contact:
    name: Physical AI Book Team
    url: https://physical-ai-book.vercel.app

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.physical-ai-book.com
    description: Production server (future)

tags:
  - name: Query
    description: RAG query operations
  - name: Health
    description: Service health and monitoring

paths:
  /api/query:
    post:
      summary: Submit a query to the RAG agent
      description: |
        Send a user question to the RAG agent and receive an AI-generated answer
        grounded in Physical AI book content with source citations.

        Supports conversation history by providing a thread_id from previous responses.
      operationId: submitQuery
      tags:
        - Query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            examples:
              newConversation:
                summary: New conversation
                value:
                  query: "What is ROS 2 and how does it differ from ROS 1?"
                  top_k: 3
              followUp:
                summary: Follow-up question
                value:
                  query: "Can you explain the DDS middleware in more detail?"
                  thread_id: "thread_abc123xyz"
                  top_k: 3
      responses:
        '200':
          description: Successful response with answer and sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
              examples:
                withSources:
                  summary: Answer with sources
                  value:
                    answer: "ROS 2 is the next generation of the Robot Operating System..."
                    sources:
                      - title: "ROS 2 Overview"
                        url: "https://physical-ai-book.vercel.app/docs/ros2/overview"
                        score: 0.92
                        chunk_index: 2
                      - title: "Migration from ROS 1"
                        url: "https://physical-ai-book.vercel.app/docs/ros2/migration"
                        score: 0.87
                        chunk_index: 5
                    thread_id: "thread_abc123xyz"
                    response_time_ms: 4523
                    request_id: "req_20251228_143022_xyz"
                noSources:
                  summary: Answer when no content found
                  value:
                    answer: "I couldn't find information about that topic in the Physical AI book."
                    sources: []
                    thread_id: "thread_def456uvw"
                    response_time_ms: 2341
                    request_id: "req_20251228_143045_abc"
        '400':
          description: Invalid query (empty, whitespace-only, or too long)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "invalid_query"
                message: "Query cannot be empty"
                request_id: "req_20251228_143022_abc"
        '422':
          description: Request validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "validation_error"
                message: "Field 'query' is required"
                request_id: "req_20251228_143022_def"
        '500':
          description: Internal server error (agent failure, database unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "assistant_execution_error"
                message: "Failed to generate response"
                request_id: "req_20251228_143022_ghi"
        '502':
          description: External service error (Cohere API, OpenAI API)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "embedding_generation_error"
                message: "Failed to generate query embedding"
                request_id: "req_20251228_143022_jkl"

  /health:
    get:
      summary: Check service health
      description: |
        Returns the current health status of the API server and RAG agent.
        Used for monitoring and frontend circuit breakers.
      operationId: healthCheck
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "healthy"
                agent_ready: true
                timestamp: "2025-12-28T14:30:22.123Z"
                version: "1.0.0"

components:
  schemas:
    QueryRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 10000
          description: User's question about Physical AI book content
          example: "What is ROS 2?"
        thread_id:
          type: string
          format: uuid
          description: OpenAI thread ID for conversation history (omit for new conversation)
          example: "thread_abc123xyz"
        top_k:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
          description: Number of relevant chunks to retrieve
          example: 3

    QueryResponse:
      type: object
      required:
        - answer
        - sources
        - thread_id
        - response_time_ms
        - request_id
      properties:
        answer:
          type: string
          description: AI-generated answer grounded in book content
          example: "ROS 2 is the next generation of the Robot Operating System..."
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
          description: List of source citations (empty if no relevant content found)
        thread_id:
          type: string
          description: OpenAI thread ID for this conversation (use for follow-up queries)
          example: "thread_abc123xyz"
        response_time_ms:
          type: integer
          description: Time taken to generate response (milliseconds)
          example: 4523
        request_id:
          type: string
          description: Unique request identifier for tracing
          example: "req_20251228_143022_xyz"

    Source:
      type: object
      required:
        - title
        - url
        - score
        - chunk_index
      properties:
        title:
          type: string
          description: Title of the source document/page
          example: "ROS 2 Overview"
        url:
          type: string
          format: uri
          description: Full URL to the source page
          example: "https://physical-ai-book.vercel.app/docs/ros2/overview"
        score:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Semantic similarity score (0.0 - 1.0)
          example: 0.92
        chunk_index:
          type: integer
          minimum: 0
          description: Index of the retrieved chunk within the source document
          example: 2

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - request_id
      properties:
        error:
          type: string
          description: Machine-readable error code
          enum:
            - invalid_query
            - query_too_long
            - validation_error
            - assistant_execution_error
            - retrieval_service_error
            - embedding_generation_error
            - internal_server_error
          example: "invalid_query"
        message:
          type: string
          description: Human-readable error message
          example: "Query cannot be empty"
        request_id:
          type: string
          description: Unique request identifier for tracing
          example: "req_20251228_143022_abc"
        details:
          type: object
          description: Additional debugging information (omitted in production)
          additionalProperties: true

    HealthResponse:
      type: object
      required:
        - status
        - agent_ready
        - timestamp
        - version
      properties:
        status:
          type: string
          enum:
            - healthy
            - degraded
          description: Overall service status
          example: "healthy"
        agent_ready:
          type: boolean
          description: Whether RAG agent is initialized and ready
          example: true
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of health check
          example: "2025-12-28T14:30:22.123Z"
        version:
          type: string
          description: API version string
          example: "1.0.0"

  securitySchemes: {}

security: []
